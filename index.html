<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Designer Portfolio</title>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Bodoni Moda"', "serif"],
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
            letterSpacing: {
              tightest: "-0.04em",
              widest: "0.3em",
            },
            borderRadius: {
              section: "56px",
              card: "32px",
            },
            colors: {
              base: "#000000",
              card: "#0a0a0a",
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700;900&family=Inter:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://d3js.org/d3-delaunay.v7.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #000;
        color: #fff;
        overflow: hidden;
      }
      .font-anton {
        font-family: "Anton", sans-serif;
      }
      html,
      body,
      button,
      a,
      [class*="cursor-pointer"] {
        cursor: none;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .hide-scrollbar {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      .experience-section {
        border-radius: 56px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: #000;
      }
      .card-dashed {
        border-radius: 32px;
        border: 1px dashed rgba(255, 255, 255, 0.25);
        background: #0a0a0a;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "d3": "https://aistudiocdn.com/d3@^7.9.0",
          "d3-delaunay": "https://aistudiocdn.com/d3-delaunay@^6.0.4"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
